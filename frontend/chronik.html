<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEKT6R — Chronik-Karten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=20260806l" />
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="cine bg-zinc-950 text-zinc-100 min-h-screen">
  <div x-data="chronikPage()" x-init="init()" x-cloak class="max-w-[1400px] mx-auto p-6">
    <header class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <img src="/static/logo.png" alt="SEKT6R" class="h-12 w-auto" />
      <nav class="flex gap-2 text-sm flex-wrap items-center">
        <a href="/" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700">Dashboard</a>
        <a href="/story" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700">Story</a>
        <a href="/chronik" class="px-3 py-1.5 rounded bg-red-700 text-white">Chronik</a>
        <a href="/mittler" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700">Mittler</a>
        <a href="/ranking" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700">Ranking</a>
        <a href="/settings" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700">Settings</a>
      </nav>
    </header>

    <section class="mb-4">
      <h2 class="text-xl font-semibold mb-1">🗓️ Chronik-Karten</h2>
      <p class="text-xs text-zinc-400">Die Karten der „Chronik der stillen Tage". Ein Bot postet täglich zur eingestellten Zeit die nächste Karte in einen Channel.</p>
    </section>

    <!-- Auto-Post-Konfiguration -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 mb-5">
      <h3 class="text-sm font-semibold text-zinc-200 mb-3">⚙️ Täglicher Auto-Post</h3>
      <div class="grid md:grid-cols-4 gap-3 items-end">
        <label class="text-xs text-zinc-400">Discord-Channel-ID
          <input x-model="cfg.channel_id" type="text" placeholder="z. B. 1234567890"
                 class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100" />
        </label>
        <label class="text-xs text-zinc-400">Uhrzeit (HH:MM)
          <input x-model="cfg.time" type="text" placeholder="09:00"
                 class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100" />
        </label>
        <label class="flex items-center gap-2 text-sm text-zinc-200 pb-1">
          <input x-model="cfg.enabled" type="checkbox" class="w-4 h-4" /> Auto-Post aktiv
        </label>
        <button @click="saveCfg()" :disabled="saving"
                class="px-4 py-2 bg-green-600 hover:bg-green-500 disabled:opacity-40 rounded text-sm font-medium">
          <span x-show="!saving">💾 Speichern</span><span x-show="saving">…</span>
        </button>
      </div>
      <div class="flex items-center gap-3 mt-4 flex-wrap text-sm">
        <span class="text-zinc-400">Fortschritt:
          <strong class="text-zinc-200" x-text="cfg.next_index"></strong> / <span x-text="total"></span> gepostet
          <template x-if="nextDate"><span> · nächste: <strong class="text-amber-400" x-text="nextDate"></strong></span></template>
          <template x-if="!nextDate && total"><span class="text-green-400"> · alle gepostet ✓</span></template>
        </span>
        <button @click="postNow()" :disabled="busy || !nextDate"
                class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 disabled:opacity-40 rounded text-xs">🤖 Nächste jetzt posten</button>
        <button @click="reset()" :disabled="busy"
                class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 disabled:opacity-40 rounded text-xs">↺ Fortschritt zurücksetzen</button>
        <button @click="regenerate()" :disabled="busy"
                class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 disabled:opacity-40 rounded text-xs">🖼 Karten neu erzeugen</button>
        <span x-show="msg" x-text="msg" class="text-green-400"></span>
        <span x-show="err" x-text="err" class="text-red-400"></span>
      </div>
    </div>

    <!-- Galerie -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <template x-for="c in cards" :key="c.filename">
        <div class="bg-zinc-900 border rounded-lg overflow-hidden flex flex-col h-full"
             :class="c.extra ? 'border-violet-700' : (c.status==='next' ? 'border-amber-500' : (c.status==='posted' ? 'border-zinc-800 opacity-60' : 'border-zinc-800'))">
          <template x-if="c.exists">
            <a :href="c.url" target="_blank"><img :src="c.url" :alt="c.date" class="w-full block" loading="lazy" /></a>
          </template>
          <template x-if="!c.exists">
            <div class="w-full aspect-[1080/900] flex items-center justify-center text-zinc-600 text-xs">fehlt — „neu erzeugen"</div>
          </template>
          <div class="flex items-center justify-between px-2 py-1.5 text-xs gap-1">
            <span class="text-zinc-300 truncate" x-text="c.date + '.2026' + (c.label ? ' · ' + c.label : '')"></span>
            <span x-show="!c.extra" x-text="c.status==='posted' ? '✓ gepostet' : (c.status==='next' ? '▶ nächste' : '')"
                  :class="c.status==='posted' ? 'text-green-500' : (c.status==='next' ? 'text-amber-400' : 'text-zinc-600')"></span>
            <span x-show="c.extra" class="text-violet-400 whitespace-nowrap">✦ Zusatzkarte</span>
          </div>
          <div class="px-2 pb-2 mt-auto flex gap-1">
            <button @click="postCard(c)" :disabled="busy || !c.exists"
                    class="flex-1 px-2 py-1 bg-zinc-800 hover:bg-blue-700 disabled:opacity-40 rounded text-xs text-zinc-200">
              🤖 <span x-text="c.status==='posted' ? 'erneut senden' : 'senden'"></span>
            </button>
            <button @click="regenCard(c)" :disabled="busy" title="Nur diese Karte neu erzeugen"
                    class="px-2 py-1 bg-zinc-800 hover:bg-zinc-600 disabled:opacity-40 rounded text-xs text-zinc-300 whitespace-nowrap">🖼 neu</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    function chronikPage(){
      return {
        cards: [], total: 0, cfg: {enabled:false, channel_id:"", time:"09:00", next_index:0},
        saving:false, busy:false, msg:"", err:"", bust: Date.now(),
        get nextDate(){ const c=this.cards.find(x=>x.status==='next'); return c ? c.date+'.2026' : null; },
        async init(){ await this.load(); },
        async load(){
          const r = await fetch('/api/chronik/cards'); const j = await r.json();
          this.cards = j.cards; this.total = j.total; this.cfg = j.config;
        },
        flash(m,isErr){ if(isErr){this.err=m;this.msg="";} else {this.msg=m;this.err="";} setTimeout(()=>{this.msg="";this.err="";},4000); },
        async saveCfg(){
          this.saving=true;
          try{
            const r=await fetch('/api/chronik/config',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({enabled:this.cfg.enabled, channel_id:this.cfg.channel_id, time:this.cfg.time})});
            if(!r.ok) throw new Error(await r.text());
            this.cfg=await r.json(); this.flash("Gespeichert ✓");
          }catch(e){ this.flash("Fehler: "+e.message,true); } finally{ this.saving=false; }
        },
        async postNow(){
          this.busy=true;
          try{
            const r=await fetch('/api/chronik/post-now',{method:'POST'});
            const j=await r.json(); if(!r.ok) throw new Error(j.error||j.detail||'Fehler');
            this.flash("Karte "+j.posted+" gepostet ✓"); await this.load();
          }catch(e){ this.flash("Post-Fehler: "+e.message,true); } finally{ this.busy=false; }
        },
        async postCard(c){
          if(!c.exists) return;
          this.busy=true;
          try{
            const r=await fetch('/api/chronik/post-card',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({filename:c.filename})});
            const j=await r.json(); if(!r.ok) throw new Error(j.error||j.detail||'Fehler');
            this.flash("Karte "+j.posted+" gesendet ✓"); await this.load();
          }catch(e){ this.flash("Sende-Fehler: "+e.message,true); } finally{ this.busy=false; }
        },
        async regenCard(c){
          this.busy=true; this.flash("Erzeuge "+c.date+"…");
          try{
            const r=await fetch('/api/chronik/regenerate',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({filename:c.filename})});
            const j=await r.json(); if(!r.ok) throw new Error(j.error||j.detail||'Fehler');
            this.bust=Date.now(); await this.load(); this.flash("Karte "+c.date+" neu erzeugt ✓");
          }catch(e){ this.flash("Renderer-Fehler: "+e.message,true); } finally{ this.busy=false; }
        },
        async reset(){
          if(!confirm("Fortschritt zurücksetzen? Die nächste Karte ist dann wieder die erste.")) return;
          this.busy=true;
          try{ const r=await fetch('/api/chronik/reset',{method:'POST'}); this.cfg=await r.json(); await this.load(); this.flash("Zurückgesetzt ✓"); }
          catch(e){ this.flash("Fehler: "+e.message,true); } finally{ this.busy=false; }
        },
        async regenerate(){
          this.busy=true; this.flash("Erzeuge Karten…");
          try{ const r=await fetch('/api/chronik/regenerate',{method:'POST'}); const j=await r.json();
            if(!r.ok) throw new Error(j.detail||'Fehler'); this.bust=Date.now(); await this.load(); this.flash("Karten erzeugt ("+j.count+") ✓"); }
          catch(e){ this.flash("Renderer-Fehler: "+e.message,true); } finally{ this.busy=false; }
        },
      };
    }
  </script>
</body>
</html>
